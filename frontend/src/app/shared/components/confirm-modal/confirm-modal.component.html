<div class="modal-backdrop" *ngIf="state" (click)="cancel()" role="dialog" aria-modal="true">
  <div class="modal-box" (click)="$event.stopPropagation()">

    <div class="modal-header">
      <div class="modal-icon" [class.modal-icon-danger]="state.danger !== false" [class.modal-icon-primary]="state.danger === false">
        <app-icon *ngIf="state.danger !== false" name="warning" [size]="22"></app-icon>
        <app-icon *ngIf="state.danger === false" name="info" [size]="22"></app-icon>
      </div>
      <div>
        <h3 class="modal-title">{{ state.title || (state.danger !== false ? 'Confirmer la suppression' : 'Confirmation') }}</h3>
        <p class="modal-message">{{ state.message }}</p>
      </div>
    </div>

    <div *ngIf="state.withInput" class="modal-input-wrap">
      <label class="modal-input-label" *ngIf="state.inputLabel">{{ state.inputLabel }}</label>
      <textarea
        class="modal-textarea"
        [(ngModel)]="inputValue"
        [placeholder]="state.inputPlaceholder || ''"
        rows="4"
        autofocus
      ></textarea>
    </div>

    <div class="modal-actions">
      <button class="btn btn-outline" type="button" (click)="cancel()">
        {{ state.cancelLabel || 'Annuler' }}
      </button>
      <button
        class="btn"
        type="button"
        [class.btn-danger]="state.danger !== false"
        [class.btn-primary]="state.danger === false"
        (click)="accept()"
        [disabled]="state.withInput && !inputValue.trim()"
      >
        {{ state.confirmLabel || (state.danger !== false ? 'Supprimer' : 'Confirmer') }}
      </button>
    </div>

  </div>
</div>
